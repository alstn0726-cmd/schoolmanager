<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>학교업무 매니징 페이지</title>
  <style>

:root {
  --bg: #f5f7f4;
  --panel: #ffffff;
  --sidebar: #17342e;
  --sidebar-soft: #21463d;
  --accent: #497c6d;
  --accent-soft: #e5efeb;
  --text: #1f2926;
  --muted: #7b8783;
  --border: #dde4e1;
  --shadow: 0 14px 35px rgba(31, 41, 38, .08);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}
button, input { font: inherit; }

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 270px 1fr;
}

.sidebar {
  background: var(--sidebar);
  color: white;
  padding: 28px 20px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  position: sticky;
  top: 0;
}

.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 0 6px 26px;
  border-bottom: 1px solid rgba(255,255,255,.12);
}
.brand-mark {
  width: 42px; height: 42px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: #dbeae4;
  color: #17342e;
  font-weight: 800;
}
.brand h1 { font-size: 16px; margin: 0 0 3px; }
.brand p { margin: 0; font-size: 12px; opacity: .65; }

.main-nav { margin-top: 24px; }
.nav-group, .subitem {
  width: 100%;
  border: 0;
  cursor: pointer;
  text-align: left;
  color: white;
}
.nav-group {
  background: transparent;
  padding: 14px 13px;
  border-radius: 12px;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
}
.nav-group:hover, .nav-group.active { background: var(--sidebar-soft); }

.submenu {
  display: none;
  padding: 7px 0 12px 10px;
}
.submenu.open { display: block; }
.subitem {
  background: transparent;
  padding: 11px 12px 11px 18px;
  border-radius: 10px;
  font-size: 13px;
  opacity: .72;
  position: relative;
}
.subitem.active {
  opacity: 1;
  background: rgba(255,255,255,.10);
}
.subitem.active::before {
  content: "";
  position: absolute;
  left: 6px; top: 13px;
  width: 4px; height: 16px;
  border-radius: 5px;
  background: #b8d7cc;
}

.sidebar-footer {
  margin-top: auto;
  padding: 16px 8px 0;
  border-top: 1px solid rgba(255,255,255,.12);
  display: flex;
  flex-direction: column;
  gap: 3px;
  opacity: .55;
  font-size: 12px;
}

.content { padding: 34px 38px 60px; }
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}
.eyebrow {
  margin: 0 0 7px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .14em;
  color: var(--accent);
}
.topbar h2 { margin: 0; font-size: 28px; }
.date-chip {
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 9px 13px;
  border-radius: 999px;
  font-size: 12px;
  color: var(--muted);
}

.workspace { max-width: 1200px; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 22px;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 18px;
}
.section-header h3 { margin: 0; font-size: 17px; }
.section-header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

.tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.tab-btn, .add-tab-btn {
  border: 1px solid var(--border);
  background: white;
  border-radius: 11px;
  padding: 9px 13px;
  cursor: pointer;
  font-weight: 650;
  color: var(--text);
}
.tab-btn.active {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: #245447;
}
.add-tab-btn {
  color: var(--accent);
  border-style: dashed;
}

.subject-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
.subject-card {
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 17px;
  background: #fbfcfb;
}
.subject-title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 14px;
}

.year-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.year-btn, .mini-add {
  border: 1px solid var(--border);
  background: white;
  padding: 7px 10px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 12px;
}
.year-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.file-zone {
  border: 1px dashed #bdcbc6;
  min-height: 136px;
  border-radius: 14px;
  padding: 14px;
  background: white;
}
.file-zone-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.file-zone-header strong { font-size: 13px; }
.upload-btn {
  border: 0;
  background: var(--accent);
  color: white;
  width: 34px; height: 34px;
  border-radius: 10px;
  font-size: 20px;
  cursor: pointer;
}
.file-list {
  margin-top: 11px;
  display: grid;
  gap: 8px;
}
.file-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 10px;
  border: 1px solid #edf0ee;
  border-radius: 10px;
  background: #fafbfa;
  font-size: 12px;
}
.file-item small { color: var(--muted); }
.empty {
  color: var(--muted);
  font-size: 12px;
  padding: 22px 0 8px;
  text-align: center;
}

.simple-placeholder {
  border: 1px dashed var(--border);
  border-radius: 16px;
  padding: 34px;
  text-align: center;
  color: var(--muted);
  background: #fafbfa;
}

.add-subject {
  margin-top: 18px;
  width: 100%;
  border: 1px dashed var(--accent);
  color: var(--accent);
  background: transparent;
  padding: 12px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 700;
}

@media (max-width: 900px) {
  .app-shell { grid-template-columns: 220px 1fr; }
  .content { padding: 26px 22px; }
  .subject-grid { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <h1>School Manager</h1>
          <p>학교업무 관리 페이지</p>
        </div>
      </div>

      <nav class="main-nav">
        <button class="nav-group" data-main="work">
          <span>업무</span>
          <span class="chevron">›</span>
        </button>

        <button class="nav-group active" data-main="class">
          <span>수업</span>
          <span class="chevron">›</span>
        </button>

        <div class="submenu open" id="classMenu">
          <button class="subitem active" data-section="plan">교수학습 및 평가계획</button>
          <button class="subitem" data-section="performance">수행평가</button>
          <button class="subitem" data-section="materials">수업자료</button>
          <button class="subitem" data-section="worksheet">학습지</button>
          <button class="subitem" data-section="vibe">바이브 코딩</button>
          <button class="subitem" data-section="afterschool">방과후 수업</button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <span>Local workspace</span>
        <small>브라우저 저장 기반</small>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <p class="eyebrow">TEACHING WORKSPACE</p>
          <h2 id="pageTitle">교수학습 및 평가계획</h2>
        </div>
        <div class="topbar-right">
          <span class="date-chip" id="todayChip"></span>
        </div>
      </header>

      <section id="workspace" class="workspace"></section>
    </main>
  </div>

  <input type="file" id="hiddenFileInput" multiple hidden />
  <script>

const sectionTitles = {
  plan: "교수학습 및 평가계획",
  performance: "수행평가",
  materials: "수업자료",
  worksheet: "학습지",
  vibe: "바이브 코딩",
  afterschool: "방과후 수업"
};

const nestedSections = ["performance", "materials", "worksheet"];
const defaultSubjects = ["역사1", "역사2", "사회1", "사회2"];
const defaultYears = ["2024", "2025", "2026"];

const state = JSON.parse(localStorage.getItem("schoolManagerState") || "{}");
state.customPlanYears ||= [];
state.customSubjects ||= {};
state.customYears ||= {};
state.files ||= {};
state.activeYears ||= {};

function saveState() {
  localStorage.setItem("schoolManagerState", JSON.stringify(state));
}

function todayText() {
  const d = new Date();
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
}
document.getElementById("todayChip").textContent = todayText();

let currentSection = "plan";
let uploadTarget = null;

document.querySelectorAll(".subitem").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".subitem").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentSection = btn.dataset.section;
    document.getElementById("pageTitle").textContent = sectionTitles[currentSection];
    render();
  });
});

document.querySelector('[data-main="work"]').addEventListener("click", () => {
  document.querySelectorAll(".nav-group").forEach(b => b.classList.remove("active"));
  document.querySelector('[data-main="work"]').classList.add("active");
  document.getElementById("classMenu").classList.remove("open");
  document.getElementById("pageTitle").textContent = "업무";
  document.getElementById("workspace").innerHTML = `
    <div class="card">
      <div class="section-header">
        <div>
          <h3>업무 메뉴</h3>
          <p>세부 업무 구조를 추가할 수 있도록 비워 둔 공간입니다.</p>
        </div>
      </div>
      <div class="simple-placeholder">다음 단계에서 업무 탭을 원하는 구조로 확장할 수 있습니다.</div>
    </div>`;
});

document.querySelector('[data-main="class"]').addEventListener("click", () => {
  document.querySelectorAll(".nav-group").forEach(b => b.classList.remove("active"));
  document.querySelector('[data-main="class"]').classList.add("active");
  document.getElementById("classMenu").classList.add("open");
  document.getElementById("pageTitle").textContent = sectionTitles[currentSection];
  render();
});

function getYears(section, subject) {
  const key = `${section}::${subject}`;
  return [...defaultYears, ...(state.customYears[key] || [])];
}

function getActiveYear(section, subject) {
  const key = `${section}::${subject}`;
  return state.activeYears[key] || "2026";
}

function setActiveYear(section, subject, year) {
  state.activeYears[`${section}::${subject}`] = year;
  saveState();
  render();
}

function addYear(section, subject) {
  const value = prompt("새 하위탭 이름을 입력하세요. 예: 2027");
  if (!value) return;
  const key = `${section}::${subject}`;
  state.customYears[key] ||= [];
  if (![...defaultYears, ...state.customYears[key]].includes(value)) {
    state.customYears[key].push(value);
    state.activeYears[key] = value;
    saveState();
    render();
  }
}

function addPlanYear() {
  const value = prompt("새 하위탭 이름을 입력하세요. 예: 2027");
  if (!value) return;
  if (![...defaultYears, ...state.customPlanYears].includes(value)) {
    state.customPlanYears.push(value);
    state.activeYears["plan"] = value;
    saveState();
    render();
  }
}

function addSubject(section) {
  const value = prompt("새 하위탭 이름을 입력하세요.");
  if (!value) return;
  state.customSubjects[section] ||= [];
  if (![...defaultSubjects, ...state.customSubjects[section]].includes(value)) {
    state.customSubjects[section].push(value);
    saveState();
    render();
  }
}

function fileKey(section, subject, year) {
  return `${section}::${subject || "root"}::${year}`;
}

function startUpload(section, subject, year) {
  uploadTarget = { section, subject, year };
  const input = document.getElementById("hiddenFileInput");
  input.value = "";
  input.click();
}

document.getElementById("hiddenFileInput").addEventListener("change", e => {
  if (!uploadTarget) return;
  const key = fileKey(uploadTarget.section, uploadTarget.subject, uploadTarget.year);
  state.files[key] ||= [];
  [...e.target.files].forEach(file => {
    state.files[key].push({
      name: file.name,
      size: file.size,
      type: file.type || "파일",
      uploadedAt: new Date().toISOString()
    });
  });
  saveState();
  render();
});

function fileListHtml(section, subject, year) {
  const key = fileKey(section, subject, year);
  const items = state.files[key] || [];
  if (!items.length) return `<div class="empty">아직 업로드된 파일이 없습니다.</div>`;
  return `<div class="file-list">${
    items.map(f => `
      <div class="file-item">
        <span>${escapeHtml(f.name)}</span>
        <small>${formatSize(f.size)}</small>
      </div>`).join("")
  }</div>`;
}

function renderPlan() {
  const years = [...defaultYears, ...state.customPlanYears];
  const active = state.activeYears["plan"] || "2026";
  return `
    <div class="card">
      <div class="section-header">
        <div>
          <h3>교수학습 및 평가계획</h3>
          <p>연도별 계획 파일을 정리합니다.</p>
        </div>
      </div>
      <div class="tabs">
        ${years.map(y => `<button class="tab-btn ${y===active?'active':''}" onclick="state.activeYears['plan']='${escapeAttr(y)}'; saveState(); render();">${escapeHtml(y)}</button>`).join("")}
        <button class="add-tab-btn" onclick="addPlanYear()">+ 새 하위탭</button>
      </div>
      <div class="file-zone">
        <div class="file-zone-header">
          <strong>${escapeHtml(active)} 파일</strong>
          <button class="upload-btn" onclick="startUpload('plan','', '${escapeAttr(active)}')" title="파일 업로드">+</button>
        </div>
        ${fileListHtml("plan", "", active)}
      </div>
    </div>`;
}

function renderNested(section) {
  const subjects = [...defaultSubjects, ...(state.customSubjects[section] || [])];
  return `
    <div class="card">
      <div class="section-header">
        <div>
          <h3>${sectionTitles[section]}</h3>
          <p>과목 → 연도 → 파일의 3단 구조로 정리합니다.</p>
        </div>
      </div>

      <div class="subject-grid">
        ${subjects.map(subject => {
          const years = getYears(section, subject);
          const active = getActiveYear(section, subject);
          return `
            <article class="subject-card">
              <div class="subject-title">${escapeHtml(subject)}</div>
              <div class="year-row">
                ${years.map(y => `<button class="year-btn ${y===active?'active':''}" onclick="setActiveYear('${escapeAttr(section)}','${escapeAttr(subject)}','${escapeAttr(y)}')">${escapeHtml(y)}</button>`).join("")}
                <button class="mini-add" onclick="addYear('${escapeAttr(section)}','${escapeAttr(subject)}')">+ 하위탭</button>
              </div>

              <div class="file-zone">
                <div class="file-zone-header">
                  <strong>${escapeHtml(active)} 파일</strong>
                  <button class="upload-btn" onclick="startUpload('${escapeAttr(section)}','${escapeAttr(subject)}','${escapeAttr(active)}')" title="파일 업로드">+</button>
                </div>
                ${fileListHtml(section, subject, active)}
              </div>
            </article>`;
        }).join("")}
      </div>

      <button class="add-subject" onclick="addSubject('${escapeAttr(section)}')">+ 새 하위탭 추가</button>
    </div>`;
}

function renderSimple(section) {
  return `
    <div class="card">
      <div class="section-header">
        <div>
          <h3>${sectionTitles[section]}</h3>
          <p>이 공간은 다음 단계에서 세부 구조를 추가할 수 있습니다.</p>
        </div>
      </div>
      <div class="simple-placeholder">
        ${section === "vibe" ? "바이브 코딩 프로젝트와 링크를 정리할 수 있는 공간입니다." : "방과후 수업 자료와 계획을 정리할 수 있는 공간입니다."}
      </div>
    </div>`;
}

function render() {
  const workspace = document.getElementById("workspace");
  if (currentSection === "plan") workspace.innerHTML = renderPlan();
  else if (nestedSections.includes(currentSection)) workspace.innerHTML = renderNested(currentSection);
  else workspace.innerHTML = renderSimple(currentSection);
}

function formatSize(bytes) {
  if (!bytes) return "0 KB";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/(1024*1024)).toFixed(1) + " MB";
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}
function escapeAttr(str) {
  return String(str).replace(/\/g, "\\").replace(/'/g, "\'");
}

render();

</script>
</body>
</html>
