<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학교업무 매니저</title>
<style>
:root{
  --bg:#f5f7f4; --panel:#fff; --sidebar:#17342e; --sidebar2:#24483f;
  --accent:#4f7d70; --accent-soft:#e6efeb; --text:#202a27; --muted:#7e8885;
  --border:#dfe6e3; --shadow:0 12px 30px rgba(31,41,38,.07);
}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}
.sidebar{
  background:var(--sidebar);color:#fff;padding:26px 18px;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh
}
.brand{padding:4px 6px 26px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand h1{font-size:17px;margin:0 0 5px}.brand p{font-size:12px;opacity:.6;margin:0}
.mainnav{margin-top:24px;display:grid;gap:8px}
.mainnav button{
  border:0;background:transparent;color:#fff;text-align:left;padding:14px 14px;
  border-radius:12px;cursor:pointer;font-weight:800
}
.mainnav button:hover,.mainnav button.active{background:var(--sidebar2)}
.sidefoot{margin-top:auto;font-size:11px;opacity:.55;padding:15px 7px 0;border-top:1px solid rgba(255,255,255,.12)}
.main{padding:34px 38px 60px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--accent);margin-bottom:6px}
.topbar h2{margin:0;font-size:28px}
.date{background:#fff;border:1px solid var(--border);border-radius:999px;padding:9px 13px;color:var(--muted);font-size:12px}
.page-tabs{
  display:flex;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);
  border-radius:16px;padding:10px;margin-bottom:22px;box-shadow:var(--shadow)
}
.page-tabs button{
  border:0;background:transparent;padding:11px 14px;border-radius:10px;cursor:pointer;
  color:#59635f;font-weight:700;font-size:13px
}
.page-tabs button:hover{background:#f1f5f3}
.page-tabs button.active{background:var(--accent-soft);color:#2f5f52}
.card{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:22px}
.header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}
.header h3{margin:0 0 5px;font-size:18px}.header p{margin:0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab,.addtab{
  border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 12px;
  cursor:pointer;font-weight:700;font-size:12px
}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.addtab{border-style:dashed;color:var(--accent)}
.subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.subject{border:1px solid var(--border);border-radius:16px;background:#fbfcfb;padding:17px}
.subject h4{margin:0 0 13px;font-size:16px}
.yearrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.yearbtn,.yearadd{border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 9px;cursor:pointer;font-size:12px}
.yearbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.filebox{border:1px dashed #bccac5;background:#fff;border-radius:13px;padding:13px;min-height:128px}
.filehead{display:flex;justify-content:space-between;align-items:center}
.filehead strong{font-size:13px}
.plus{
  width:34px;height:34px;border:0;border-radius:9px;background:var(--accent);color:#fff;
  cursor:pointer;font-size:20px;line-height:1
}
.empty{text-align:center;color:var(--muted);font-size:12px;padding:23px 0 7px}
.filelist{display:grid;gap:7px;margin-top:11px}
.fileitem{padding:9px 10px;border-radius:9px;background:#f8faf9;border:1px solid #edf0ef;font-size:12px;display:flex;justify-content:space-between;gap:12px}
.fileitem small{color:var(--muted)}
.fulladd{
  width:100%;margin-top:17px;padding:12px;border:1px dashed var(--accent);
  border-radius:11px;background:transparent;color:var(--accent);cursor:pointer;font-weight:800
}
.placeholder{border:1px dashed var(--border);border-radius:15px;padding:40px;text-align:center;color:var(--muted);background:#fafbfa}

/* calendar */
.calendar-card{padding:0;overflow:hidden}
.calendar-toolbar{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:14px}
.cal-left,.cal-right{display:flex;align-items:center;gap:8px}
.iconbtn,.primarybtn,.ghostbtn{
  cursor:pointer;border-radius:10px;padding:9px 12px;font-weight:700
}
.iconbtn,.ghostbtn{background:#fff;border:1px solid var(--border);color:var(--text)}
.primarybtn{background:var(--accent);border:1px solid var(--accent);color:#fff}
.calendar-title{font-size:19px;font-weight:800;min-width:125px;text-align:center}
.sync-status{font-size:12px;color:var(--muted)}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);background:#fafbfa;border-bottom:1px solid var(--border)}
.weekdays div{padding:10px;text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.day{
  min-height:128px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:8px;position:relative;background:#fff
}
.day:nth-child(7n){border-right:none}
.day.other{background:#fafbfa;color:#a4adaa}
.day.today{background:#f7fbf9}
.daynum{font-size:12px;font-weight:800;margin-bottom:6px}
.events{display:grid;gap:4px}
.event{
  padding:5px 6px;border-radius:7px;background:var(--accent-soft);color:#315a50;
  font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.event.school{background:#e8efe9;color:#35594e}
.event.manual{background:#e8edf6;color:#263b63;border:1px solid #cfd8e8}
.calendar-settings{margin-top:18px;display:grid;grid-template-columns:1fr auto;gap:10px}
.calendar-settings input{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff}
.help{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.6}
.modalback{position:fixed;inset:0;background:rgba(15,24,21,.38);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modalback.open{display:flex}
.modal{width:min(520px,100%);background:#fff;border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.modal h3{margin:0 0 16px}
.formgrid{display:grid;gap:12px}
.formgrid label{display:grid;gap:6px;font-size:12px;font-weight:800}
.formgrid input,.formgrid textarea{border:1px solid var(--border);border-radius:10px;padding:10px 11px}
.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

@media(max-width:850px){
  .app{grid-template-columns:170px 1fr}.main{padding:24px 18px}.subject-grid{grid-template-columns:1fr}
  .calendar-grid,.weekdays{min-width:840px}.calendar-card{overflow:auto}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><h1>School Manager</h1><p>학교업무 관리 페이지</p></div>
    <div class="mainnav">
      <button id="workBtn">업무</button>
      <button id="classBtn" class="active">수업</button>
      <button id="calendarBtn">학사일정</button>
    </div>
    <div class="sidefoot">브라우저 로컬 저장 기반</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div><div class="eyebrow">SCHOOL WORKSPACE</div><h2 id="title">수업</h2></div>
      <div class="date" id="date"></div>
    </div>

    <div id="lessonTabs" class="page-tabs">
      <button data-section="plan" class="active">교수학습 및 평가계획</button>
      <button data-section="performance">수행평가</button>
      <button data-section="materials">수업자료</button>
      <button data-section="worksheet">학습지</button>
      <button data-section="vibe">바이브 코딩</button>
      <button data-section="afterschool">방과후 수업</button>
    </div>

    <section id="content"></section>
  </main>
</div>

<input type="file" id="fileInput" multiple hidden>

<div class="modalback" id="eventModal">
  <div class="modal">
    <h3>일정 추가</h3>
    <div class="formgrid">
      <label>일정 이름<input id="eventTitle" placeholder="예: 중간고사"></label>
      <label>시작 일자<input id="eventStart" type="date"></label>
      <label>종료 일자<input id="eventEnd" type="date"></label>
      <label>메모<textarea id="eventMemo" rows="3" placeholder="선택 입력"></textarea></label>
    </div>
    <div class="modalactions">
      <button class="ghostbtn" id="closeModal">취소</button>
      <button class="primarybtn" id="saveEvent">저장</button>
    </div>
  </div>
</div>

<script>
(function(){
  const DEFAULT_YEARS=["2024","2025","2026"];
  const DEFAULT_SUBJECTS=["역사1","역사2","사회1","사회2"];
  const NESTED=["performance","materials","worksheet"];
  const TITLES={
    plan:"교수학습 및 평가계획",performance:"수행평가",materials:"수업자료",
    worksheet:"학습지",vibe:"바이브 코딩",afterschool:"방과후 수업"
  };

  let state;
  try{ state=JSON.parse(localStorage.getItem("schoolManagerStateV3")||"{}"); }catch(e){ state={}; }
  state.customPlanYears ||= [];
  state.customSubjects ||= {};
  state.customYears ||= {};
  state.activeYears ||= {};
  state.files ||= {};
  state.manualEvents ||= [];
  state.schoolEvents ||= [];
  state.calendarEndpoint ||= "";

  let currentSection="plan";
  let uploadTarget=null;
  let calendarCursor=new Date();

  const content=document.getElementById("content");
  const fileInput=document.getElementById("fileInput");
  const lessonTabs=document.getElementById("lessonTabs");
  const title=document.getElementById("title");
  const workBtn=document.getElementById("workBtn");
  const classBtn=document.getElementById("classBtn");
  const calendarBtn=document.getElementById("calendarBtn");

  function save(){ localStorage.setItem("schoolManagerStateV3",JSON.stringify(state)); }
  function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])); }
  function key(section,subject,year){ return section+"::"+(subject||"root")+"::"+year; }
  function activeKey(section,subject){ return section+"::"+(subject||"root"); }
  function activeYear(section,subject){ return state.activeYears[activeKey(section,subject)] || "2026"; }
  function years(section,subject){ return [...DEFAULT_YEARS,...(state.customYears[section+"::"+subject]||[])]; }
  function fmt(bytes){ if(bytes<1024)return bytes+" B"; if(bytes<1048576)return (bytes/1024).toFixed(1)+" KB"; return (bytes/1048576).toFixed(1)+" MB"; }
  function iso(d){ return d.toISOString().slice(0,10); }
  function parseDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }

  const now=new Date();
  document.getElementById("date").textContent=`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,"0")}.${String(now.getDate()).padStart(2,"0")}`;

  function setMainActive(name){
    [workBtn,classBtn,calendarBtn].forEach(b=>b.classList.remove("active"));
    if(name==="work")workBtn.classList.add("active");
    if(name==="class")classBtn.classList.add("active");
    if(name==="calendar")calendarBtn.classList.add("active");
  }

  function fileList(section,subject,year){
    const arr=state.files[key(section,subject,year)]||[];
    if(!arr.length)return '<div class="empty">아직 업로드된 파일이 없습니다.</div>';
    return '<div class="filelist">'+arr.map(f=>`<div class="fileitem"><span>${esc(f.name)}</span><small>${fmt(f.size)}</small></div>`).join("")+'</div>';
  }

  function renderPlan(){
    const yrs=[...DEFAULT_YEARS,...state.customPlanYears];
    const active=state.activeYears["plan::root"]||"2026";
    content.innerHTML=`
      <div class="card">
        <div class="header"><div><h3>교수학습 및 평가계획</h3><p>연도별 계획 파일을 정리합니다.</p></div></div>
        <div class="tabs" id="planYears">
          ${yrs.map(y=>`<button class="tab ${y===active?"active":""}" data-year="${esc(y)}">${esc(y)}</button>`).join("")}
          <button class="addtab" id="addPlanYear">+ 새 하위탭</button>
        </div>
        <div class="filebox">
          <div class="filehead"><strong>${esc(active)} 파일</strong><button class="plus" id="planUpload">+</button></div>
          ${fileList("plan","",active)}
        </div>
      </div>`;
    document.querySelectorAll("#planYears [data-year]").forEach(btn=>btn.addEventListener("click",()=>{state.activeYears["plan::root"]=btn.dataset.year;save();renderPlan();}));
    document.getElementById("addPlanYear").addEventListener("click",()=>{
      const v=prompt("새 하위탭 이름을 입력하세요. 예: 2027"); if(!v)return;
      if(!yrs.includes(v)){state.customPlanYears.push(v);state.activeYears["plan::root"]=v;save();renderPlan();}
    });
    document.getElementById("planUpload").addEventListener("click",()=>{uploadTarget={section:"plan",subject:"",year:active};fileInput.value="";fileInput.click();});
  }

  function renderNested(section){
    const subjects=[...DEFAULT_SUBJECTS,...(state.customSubjects[section]||[])];
    content.innerHTML=`
      <div class="card">
        <div class="header"><div><h3>${TITLES[section]}</h3><p>과목 → 연도 → 파일 구조로 정리합니다.</p></div></div>
        <div class="subject-grid">
        ${subjects.map(subject=>{
          const yrs=years(section,subject), active=activeYear(section,subject);
          return `<div class="subject">
            <h4>${esc(subject)}</h4>
            <div class="yearrow">
              ${yrs.map(y=>`<button class="yearbtn ${y===active?"active":""}" data-action="year" data-subject="${esc(subject)}" data-year="${esc(y)}">${esc(y)}</button>`).join("")}
              <button class="yearadd" data-action="addYear" data-subject="${esc(subject)}">+ 하위탭</button>
            </div>
            <div class="filebox">
              <div class="filehead"><strong>${esc(active)} 파일</strong><button class="plus" data-action="upload" data-subject="${esc(subject)}" data-year="${esc(active)}">+</button></div>
              ${fileList(section,subject,active)}
            </div>
          </div>`;
        }).join("")}
        </div><button class="fulladd" id="addSubject">+ 새 하위탭 추가</button>
      </div>`;
    content.querySelectorAll("[data-action='year']").forEach(btn=>btn.addEventListener("click",()=>{state.activeYears[activeKey(section,btn.dataset.subject)]=btn.dataset.year;save();renderNested(section);}));
    content.querySelectorAll("[data-action='addYear']").forEach(btn=>btn.addEventListener("click",()=>{
      const subject=btn.dataset.subject, v=prompt("새 하위탭 이름을 입력하세요. 예: 2027"); if(!v)return;
      const k=section+"::"+subject; state.customYears[k] ||= [];
      if(!years(section,subject).includes(v)){state.customYears[k].push(v);state.activeYears[activeKey(section,subject)]=v;save();renderNested(section);}
    }));
    content.querySelectorAll("[data-action='upload']").forEach(btn=>btn.addEventListener("click",()=>{uploadTarget={section,subject:btn.dataset.subject,year:btn.dataset.year};fileInput.value="";fileInput.click();}));
    document.getElementById("addSubject").addEventListener("click",()=>{
      const v=prompt("새 하위탭 이름을 입력하세요."); if(!v)return; state.customSubjects[section] ||= [];
      if(!subjects.includes(v)){state.customSubjects[section].push(v);save();renderNested(section);}
    });
  }

  function renderSimple(section){
    content.innerHTML=`<div class="card"><div class="header"><div><h3>${TITLES[section]}</h3><p>필요한 항목을 계속 확장할 수 있는 공간입니다.</p></div></div><div class="placeholder">${section==="vibe"?"바이브 코딩 프로젝트와 링크를 관리할 공간입니다.":"방과후 수업 계획과 자료를 관리할 공간입니다."}</div></div>`;
  }

  function selectLesson(section){
    currentSection=section; setMainActive("class"); title.textContent="수업"; lessonTabs.style.display="flex";
    lessonTabs.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.section===section));
    if(section==="plan")renderPlan(); else if(NESTED.includes(section))renderNested(section); else renderSimple(section);
  }

  function eventsForDate(dateStr){
    const all=[
      ...state.schoolEvents.map(e=>({...e,kind:"school"})),
      ...state.manualEvents.map(e=>({...e,kind:"manual"}))
    ];
    const dt=parseDate(dateStr);
    return all.filter(e=>{
      const s=parseDate(e.start), en=parseDate(e.end||e.start);
      return dt>=s && dt<=en;
    });
  }

  function renderCalendar(){
    setMainActive("calendar"); title.textContent="학사일정"; lessonTabs.style.display="none";
    const y=calendarCursor.getFullYear(), m=calendarCursor.getMonth();
    const first=new Date(y,m,1), last=new Date(y,m+1,0);
    const start=new Date(y,m,1-first.getDay());
    let cells="";
    for(let i=0;i<42;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const ds=iso(d), evs=eventsForDate(ds), other=d.getMonth()!==m, today=iso(d)===iso(new Date());
      cells+=`<div class="day ${other?"other":""} ${today?"today":""}" data-date="${ds}">
        <div class="daynum">${d.getDate()}</div>
        <div class="events">${evs.slice(0,4).map(e=>`<div class="event ${e.kind}" title="${esc(e.title)}">${esc(e.title)}</div>`).join("")}${evs.length>4?`<div class="event">+${evs.length-4}개</div>`:""}</div>
      </div>`;
    }
    content.innerHTML=`
      <div class="card calendar-card">
        <div class="calendar-toolbar">
          <div class="cal-left">
            <button class="iconbtn" id="prevMonth">‹</button>
            <div class="calendar-title">${y}년 ${m+1}월</div>
            <button class="iconbtn" id="nextMonth">›</button>
            <button class="ghostbtn" id="todayMonth">오늘</button>
          </div>
          <div class="cal-right">
            <span class="sync-status" id="syncStatus">${state.calendarEndpoint?"학교 일정 연동 URL 저장됨":"학교 일정 연동 URL 미설정"}</span>
            <button class="primarybtn" id="addEventBtn">+ 일정 추가</button>
          </div>
        </div>
        <div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
        <div class="calendar-grid">${cells}</div>
      </div>

      <div class="card" style="margin-top:18px">
        <div class="header"><div><h3>학교 학사일정 자동 연동</h3><p>Google Apps Script 웹앱 URL을 입력하면 학교 홈페이지 일정을 불러옵니다.</p></div></div>
        <div class="calendar-settings">
          <input id="endpointInput" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(state.calendarEndpoint)}">
          <button class="primarybtn" id="syncBtn">저장 & 동기화</button>
        </div>
        <div class="help">
          연동 대상: 매포중학교 학사일정 페이지<br>
          https://school.cbe.go.kr/maepo-m/M010313/list<br>
          ※ 브라우저에서 학교 홈페이지를 직접 읽는 방식은 차단될 수 있어 Apps Script를 중계 서버로 사용합니다.
        </div>
      </div>`;

    document.getElementById("prevMonth").addEventListener("click",()=>{calendarCursor=new Date(y,m-1,1);renderCalendar();});
    document.getElementById("nextMonth").addEventListener("click",()=>{calendarCursor=new Date(y,m+1,1);renderCalendar();});
    document.getElementById("todayMonth").addEventListener("click",()=>{calendarCursor=new Date();renderCalendar();});
    document.getElementById("addEventBtn").addEventListener("click",openEventModal);
    document.querySelectorAll(".day").forEach(el=>el.addEventListener("dblclick",()=>openEventModal(el.dataset.date)));
    document.getElementById("syncBtn").addEventListener("click",async()=>{
      state.calendarEndpoint=document.getElementById("endpointInput").value.trim(); save();
      if(!state.calendarEndpoint){alert("Apps Script 웹앱 URL을 입력하세요.");renderCalendar();return;}
      await syncSchoolEvents();
    });
  }

  async function syncSchoolEvents(){
    const status=document.getElementById("syncStatus");
    if(status)status.textContent="동기화 중...";
    try{
      const url=new URL(state.calendarEndpoint);
      url.searchParams.set("year",calendarCursor.getFullYear());
      const res=await fetch(url.toString());
      if(!res.ok)throw new Error("HTTP "+res.status);
      const data=await res.json();
      if(!Array.isArray(data.events))throw new Error("events 배열이 없습니다.");
      state.schoolEvents=data.events.map(e=>({title:e.title,start:e.start,end:e.end||e.start,memo:e.memo||""}));
      save();
      renderCalendar();
    }catch(err){
      alert("학사일정 동기화에 실패했습니다.\n"+err.message);
      renderCalendar();
    }
  }

  function openEventModal(dateStr=""){
    document.getElementById("eventTitle").value="";
    document.getElementById("eventStart").value=dateStr;
    document.getElementById("eventEnd").value=dateStr;
    document.getElementById("eventMemo").value="";
    document.getElementById("eventModal").classList.add("open");
  }
  function closeEventModal(){document.getElementById("eventModal").classList.remove("open");}

  lessonTabs.querySelectorAll("[data-section]").forEach(btn=>btn.addEventListener("click",()=>selectLesson(btn.dataset.section)));
  workBtn.addEventListener("click",()=>{
    setMainActive("work"); lessonTabs.style.display="none"; title.textContent="업무";
    content.innerHTML='<div class="card"><div class="header"><div><h3>업무</h3><p>업무 메뉴의 세부 탭은 다음 단계에서 추가할 수 있습니다.</p></div></div><div class="placeholder">업무 관리 영역</div></div>';
  });
  classBtn.addEventListener("click",()=>selectLesson(currentSection));
  calendarBtn.addEventListener("click",renderCalendar);

  fileInput.addEventListener("change",()=>{
    if(!uploadTarget||!fileInput.files.length)return;
    const k=key(uploadTarget.section,uploadTarget.subject,uploadTarget.year); state.files[k] ||= [];
    Array.from(fileInput.files).forEach(f=>state.files[k].push({name:f.name,size:f.size,type:f.type||"파일"})); save();
    if(uploadTarget.section==="plan")renderPlan(); else renderNested(uploadTarget.section);
  });

  document.getElementById("closeModal").addEventListener("click",closeEventModal);
  document.getElementById("eventModal").addEventListener("click",e=>{if(e.target.id==="eventModal")closeEventModal();});
  document.getElementById("saveEvent").addEventListener("click",()=>{
    const t=document.getElementById("eventTitle").value.trim();
    const s=document.getElementById("eventStart").value;
    const en=document.getElementById("eventEnd").value||s;
    const memo=document.getElementById("eventMemo").value.trim();
    if(!t||!s){alert("일정 이름과 시작 일자를 입력하세요.");return;}
    if(en<s){alert("종료 일자는 시작 일자보다 빠를 수 없습니다.");return;}
    state.manualEvents.push({title:t,start:s,end:en,memo}); save(); closeEventModal(); renderCalendar();
  });

  selectLesson("plan");
})();
</script>
</body>
</html>
